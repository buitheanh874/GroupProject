# v3_decay_mult.yaml - Decay with worker diversity (CURRENT BEST)
# Epsilon decays from 0.60 to 0.05, workers have different multipliers

# Inherit from base train_1.yaml but override exploration and parallel
_inherit: ../../configs/train_1.yaml

run:
  run_name: ablation_v3_decay_mult

exploration:
  # Decay schedule
  eps_start: 0.60
  eps_end: 0.05
  warmup_global_steps: 8000
  eps_decay_steps: 60000

parallel:
  enabled: true
  num_actors: 4
  base_port: 9500
  base_seed: 42  # Override via command line for different seeds
  chunk_size: 256
  queue_max_chunks: 200
  sync_every_updates: 100
  # Per-worker diversity multipliers
  epsilon_worker_multipliers: [0.85, 0.95, 1.05, 1.15]
  reset_max_retries: 3
  reset_backoff_base_sec: 1.0
  reset_backoff_cap_sec: 8.0
  max_update_time_ms: 50.0

logging:
  log_dir: experiments/ablation_epsilon_v1/runs/v3_decay_mult/curriculum_seed42
  model_dir: experiments/ablation_epsilon_v1/runs/v3_decay_mult/curriculum_seed42/checkpoints
  results_dir: experiments/ablation_epsilon_v1/runs/v3_decay_mult/curriculum_seed42/eval
