normalization:
  file: configs/norm_turn801010.json

agent:
  hidden_dims: [256, 256]
  gamma: 0.99
  use_time_aware_gamma: true
  t_ref: 60.0
  learning_rate: 0.0003       # OPTIMIZED: 3x increase for faster learning
  batch_size: 256
  replay_buffer_size: 200000
  target_update_freq: 1000    # OPTIMIZED: 5x more frequent for stability
  clip_grad_norm: 10.0
  learning_starts: 3000       # OPTIMIZED: longer warmup for parallel
  train_freq: 4            
  use_huber_loss: true       

exploration:
  # === OPTIMIZED EPSILON SCHEDULE FOR 10 WORKERS ===
  # Total training: 10 workers × 100 eps × ~20 steps = ~20,000 global steps
  # 
  # Timeline:
  #   Step 0-2000:     Warmup, ε=0.80 constant (10% of training)
  #   Step 2000-8000:  Decay, ε=0.80→0.05 linear (30% of training)
  #   Step 8000+:      Exploitation, ε=0.05
  #
  # With multipliers [0.80-1.25], effective range: ε=0.64-1.0 → ε=0.04-0.0625
  eps_start: 0.80             # OPTIMIZED: more exploration at start
  eps_end: 0.05
  warmup_global_steps: 2000   # OPTIMIZED: 2.5x longer warmup (10% of training)
  eps_decay_steps: 6000       # OPTIMIZED: 6x slower decay (ends at step 8000, 40% of training)

train:
  episodes: 1000  # TOTAL: 10 workers x 100 episodes = 1000 episodes
  save_every_episodes: 100
  print_every_episodes: 20
  # === GATE 3 & 4 EVIDENCE ===
  smoke_eval_every: 100    # Smoke eval mỗi 100 eps → 10 entries (Gate 3)
  smoke_eval_demand: 750
  smoke_eval_horizon_sec: 750
  curriculum_hist_every: 50   # Curriculum hist mỗi 50 eps → 20 snapshots (Gate 4 sớm tại ~150 eps)

baseline:
  fixed_action_id: 12

curriculum:
  # === MIX PHASE DESIGN (300/400/300 = 1000 episodes) ===
  # Mục tiêu: Không quên phase dễ khi train phase khó
  # Strategy: Interleaved curriculum với revisit phases
  # 
  # PHASE DISTRIBUTION:
  #   Phase 1 (Easy-500):     150 eps - Foundation learning
  #   Phase 2 (Medium-750):   200 eps - Scale up difficulty  
  #   Phase 3 (Hard-1000):    150 eps - Initial hard exposure
  #   --- REVISIT BLOCK (prevent forgetting) ---
  #   Phase 4 (Easy-500):      50 eps - Refresh easy patterns
  #   Phase 5 (Medium-750):   100 eps - Reinforce medium
  #   Phase 6 (Hard-1000):    100 eps - More hard exposure
  #   --- FINAL POLISH ---
  #   Phase 7 (Easy-500):     100 eps - Final easy polish
  #   Phase 8 (Medium-750):   100 eps - Final medium polish
  #   Phase 9 (Hard-1000):     50 eps - Final hard test
  #
  # TOTALS: Easy=300, Medium=400, Hard=300 ✓
  enabled: true
  phases:
    # === INITIAL LEARNING BLOCK (500 episodes) ===
    - name: "easy_foundation"
      episodes: 150
      max_sim_seconds: 1800
      route_pool_manifest: networks/variants/train_turn801010/500/manifest.txt
      description: "Phase 1: Easy (500 veh/hr) - Foundation learning"

    - name: "medium_scaleup"
      episodes: 200
      max_sim_seconds: 1800
      route_pool_manifest: networks/variants/train_turn801010/750/manifest.txt
      description: "Phase 2: Medium (750 veh/hr) - Scale up difficulty"

    - name: "hard_initial"
      episodes: 150
      max_sim_seconds: 1800
      route_pool_manifest: networks/variants/train_turn801010/1000/manifest.txt
      description: "Phase 3: Hard (1000 veh/hr) - Initial hard exposure"

    # === REVISIT BLOCK (250 episodes) - Prevent forgetting ===
    - name: "easy_refresh"
      episodes: 50
      max_sim_seconds: 1800
      route_pool_manifest: networks/variants/train_turn801010/500/manifest.txt
      description: "Phase 4: Easy refresh - Prevent forgetting easy patterns"

    - name: "medium_reinforce"
      episodes: 100
      max_sim_seconds: 1800
      route_pool_manifest: networks/variants/train_turn801010/750/manifest.txt
      description: "Phase 5: Medium reinforcement"

    - name: "hard_expand"
      episodes: 100
      max_sim_seconds: 1800
      route_pool_manifest: networks/variants/train_turn801010/1000/manifest.txt
      description: "Phase 6: Hard expansion - More hard exposure"

    # === FINAL POLISH BLOCK (250 episodes) ===
    - name: "easy_polish"
      episodes: 100
      max_sim_seconds: 1800
      route_pool_manifest: networks/variants/train_turn801010/500/manifest.txt
      description: "Phase 7: Final easy polish"

    - name: "medium_polish"
      episodes: 100
      max_sim_seconds: 1800
      route_pool_manifest: networks/variants/train_turn801010/750/manifest.txt
      description: "Phase 8: Final medium polish"

    - name: "hard_final"
      episodes: 50
      max_sim_seconds: 1800
      route_pool_manifest: networks/variants/train_turn801010/1000/manifest.txt
      description: "Phase 9: Final hard test - Low epsilon exploitation"

logging:
  log_dir: logs/2
  model_dir: models/2
  results_dir: results/2

parallel:
  enabled: true  
  num_actors: 10  
  base_port: 9500
  base_seed: 42
  chunk_size: 256
  queue_max_chunks: 200
  sync_every_updates: 100
  epsilon_worker_multipliers: [0.80, 0.85, 0.90, 0.95, 1.00, 1.05, 1.10, 1.15, 1.20, 1.25]
  reset_max_retries: 3
  reset_backoff_base_sec: 1.0
  reset_backoff_cap_sec: 8.0
  max_update_time_ms: 50.0