run:
  run_name: train_v2_optimized
  seed: 42
  device: cpu

env:
  type: sumo
  sumo:
    teleport_penalty_lambda: 5.0
    teleport_time_cap_sec: null
    sumo_binary: sumo
    net_file: networks/BIGNET.net.xml
    route_file: networks/variants/train/800/bignet_train_seed00042_d800.rou.xml 
    additional_files: []
    tls_ids: ["J0", "J1", "J2", "J3", "J4", "J6", "J7", "J14", "J17"]
    center_tls_id: "J0"
    downstream_links:
      N: "E3"
      E: "E0"
      S: "E2"
      W: "E1"
    vehicle_weights:
      motorcycle: 0.25
      passenger: 1.0
      bus: 3.0
    step_length_sec: 1.0
    green_cycle_sec: 90
    yellow_sec: 3
    all_red_sec: 2
    max_cycles: 60
    max_sim_seconds: 3600
    terminate_on_empty: false
    rho_min: 0.1
    g_min_sec: 10
    cycle_options_sec: [60, 90, 120]
    action_splits:
      - [0.30, 0.70]
      - [0.40, 0.60]
      - [0.50, 0.50]
      - [0.60, 0.40]
      - [0.70, 0.30]
    action_table: []
    include_transition_in_waiting: false
    reward_time_normalize: true

    sumo_extra_args:
      - "--ignore-junction-blocker"
      - "1"
      - "--time-to-teleport"
      - "300"
      - "--no-warnings"
      - "true"

    enable_kpi_tracker: true
    normalize_state: true
    return_raw_state: false
    state_dim: 14  # SMDP v5: 12 local + 2 global broadcast (n_present_norm, spill_scalar_norm)
    enable_downstream_occupancy: true
    enable_spillback_penalty: true
    alpha_spillback: 3.0

    deadlock_early_no_arrival_sec: 0
    deadlock_no_arrival_sec: 0
    deadlock_queue_threshold: 0
    deadlock_downstream_occ_threshold: 0
    deadlock_active_min: 0
    deadlock_early_penalty_max: 0
