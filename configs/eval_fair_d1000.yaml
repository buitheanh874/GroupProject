# Fair Evaluation Config - d1000 demand (UNSEEN routes)
# Uses routes seed102-111 which were NOT used in training
# Demand 1000 veh/hr/lane is within training curriculum (phase4)

run:
  run_name: eval_fair_d1000
  seed: 42
  device: cpu

env:
  type: sumo
  sumo:
    teleport_penalty_lambda: 0.0
    teleport_time_cap_sec: null
    sumo_binary: sumo
    net_file: networks/BIGNET.net.xml
    route_file: networks/variants/train/1000/bignet_train_seed00102_d1000.rou.xml
    additional_files: []
    tls_ids: ["J0", "J1", "J2", "J3", "J4", "J6", "J7", "J14", "J17"]
    center_tls_id: "J0"
    downstream_links:
      N: "E3"
      E: "E0"
      S: "E2"
      W: "E1"
    vehicle_weights:
      motorcycle: 0.25
      passenger: 1.0
      bus: 3.0
    step_length_sec: 1.0
    green_cycle_sec: 90
    yellow_sec: 3
    all_red_sec: 2
    max_cycles: 60
    max_sim_seconds: 1800
    terminate_on_empty: false
    rho_min: 0.1
    cycle_options_sec: [60, 90, 120]
    action_splits:
      - [0.30, 0.70]
      - [0.40, 0.60]
      - [0.50, 0.50]
      - [0.60, 0.40]
      - [0.70, 0.30]
    action_table: []
    include_transition_in_waiting: false
    sumo_extra_args:
      - "--ignore-junction-blocker"
      - "1"
      - "--time-to-teleport"
      - "300"
    enable_kpi_tracker: true
    normalize_state: true
    return_raw_state: false
    state_dim: 12
    enable_downstream_occupancy: true
    enable_spillback_penalty: true
    lane_groups_by_tls:
      J0:
        lanes_ns_ctrl: ["-E2_0", "-E2_1", "-E2_2", "-E3_0", "-E3_1", "-E3_2"]
        lanes_ew_ctrl: ["-E0_0", "-E0_1", "-E0_2", "-E1_0", "-E1_1", "-E1_2"]
      J3:
        lanes_ns_ctrl: ["-E25_0", "-E25_1", "-E25_2", "E2_0", "E2_1", "E2_2"]
        lanes_ew_ctrl: ["-E26_0", "-E26_1", "-E26_2", "E24_0", "E24_1", "E24_2"]
      J1:
        lanes_ns_ctrl: ["-E6_0", "-E6_1", "-E6_2", "-E5_0", "-E5_1", "-E5_2"]
        lanes_ew_ctrl: ["-E4_0", "-E4_1", "-E4_2", "E0_0", "E0_1", "E0_2"]
      J4:
        lanes_ns_ctrl: ["E3_0", "E3_1", "E3_2", "-E16_0", "-E16_1", "-E16_2"]
        lanes_ew_ctrl: ["E14_0", "E14_1", "E14_2", "-E15_0", "-E15_1", "-E15_2"]
      J2:
        lanes_ns_ctrl: ["-E19_0", "-E19_1", "-E19_2", "-E18_0", "-E18_1", "-E18_2"]
        lanes_ew_ctrl: ["E1_0", "E1_1", "E1_2", "-E17_0", "-E17_1", "-E17_2"]
      J7:
        lanes_ns_ctrl: ["-E27_0", "-E27_1", "-E27_2", "E6_0", "E6_1", "E6_2"]
        lanes_ew_ctrl: ["-E28_0", "-E28_1", "-E28_2", "E26_0", "E26_1", "E26_2"]
      J6:
        lanes_ns_ctrl: ["E5_0", "E5_1", "E5_2", "-E13_0", "-E13_1", "-E13_2"]
        lanes_ew_ctrl: ["-E12_0", "-E12_1", "-E12_2", "-E14_0", "-E14_1", "-E14_2"]
      J14:
        lanes_ns_ctrl: ["E18_0", "E18_1", "E18_2", "-E21_0", "-E21_1", "-E21_2"]
        lanes_ew_ctrl: ["E15_0", "E15_1", "E15_2", "-E20_0", "-E20_1", "-E20_2"]
      J17:
        lanes_ns_ctrl: ["-E22_0", "-E22_1", "-E22_2", "E19_0", "E19_1", "E19_2"]
        lanes_ew_ctrl: ["-E24_0", "-E24_1", "-E24_2", "-E23_0", "-E23_1", "-E23_2"]
    phase_program:
      ew_green: 0
      ew_yellow: 1
      all_red: 2
      ns_green: 3
      ns_yellow: 4
    tls_phase_overrides:
      J17:
        ns_green: 0
        ew_green: 3
      J2:
        ns_green: 0
        ew_green: 3
      J3:
        ns_green: 0
        ew_green: 3
      J14:
        ns_green: 0
        ew_green: 3
      J7:
        ns_green: 0
        ew_green: 3

normalization:
  file: configs/norm_curriculum_v3_short.json

eval:
  model_path: models/bignet_300ep/train_bignet_300ep_best.pt
  runs: 10
  route_pool_manifest: networks/variants/train/manifest_eval_d1000.txt

baseline:
  fixed_action_id: 7  

logging:
  results_dir: results/eval_fair_d1000
