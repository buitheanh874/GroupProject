run:
  run_name: parallel_smoke_test
  seed: 42
  device: cpu

env:
  type: sumo
  sumo:
    sumo_binary: sumo
    net_file: networks/BIGNET.net.xml
    route_file: networks/variants/train/bignet_train_seed00042.rou.xml
    additional_files: []
    tls_ids: ["J0", "J1", "J2", "J3", "J4", "J6", "J7", "J14", "J17"]
    center_tls_id: "J0"
    downstream_links:
      N: "E3"
      E: "E0"
      S: "E2"
      W: "E1"
    vehicle_weights:
      motorcycle: 0.25
      passenger: 1.0
      bus: 3.0
    step_length_sec: 1.0
    green_cycle_sec: 90
    yellow_sec: 3
    all_red_sec: 2
    max_cycles: 10
    max_sim_seconds: 600
    terminate_on_empty: false
    rho_min: 0.1
    g_min_sec: 10
    cycle_options_sec: [60, 90, 120]
    action_splits:
      - [0.30, 0.70]
      - [0.40, 0.60]
      - [0.50, 0.50]
      - [0.60, 0.40]
      - [0.70, 0.30]
    action_table: []
    include_transition_in_waiting: false
    reward_time_normalize: true
    sumo_extra_args:
      - "--ignore-junction-blocker"
      - "1"
      - "--time-to-teleport"
      - "300"
      - "--no-warnings"
    enable_kpi_tracker: false
    normalize_state: true
    return_raw_state: false
    state_dim: 12
    enable_downstream_occupancy: true
    enable_spillback_penalty: false
    alpha_spillback: 1.0
    deadlock_early_no_arrival_sec: 0
    deadlock_no_arrival_sec: 0
    deadlock_queue_threshold: 0
    deadlock_downstream_occ_threshold: 0
    deadlock_active_min: 0
    deadlock_early_penalty_max: 0
    deadlock_penalty: 0
    terminate_on_deadlock: false
    teleport_failure_when_congested: false
    lane_groups_by_tls:
      J0:
        lanes_ns_ctrl: ["-E2_0", "-E2_1", "-E2_2", "-E3_0", "-E3_1", "-E3_2"]
        lanes_ew_ctrl: ["-E0_0", "-E0_1", "-E0_2", "-E1_0", "-E1_1", "-E1_2"]
        approach_lanes:
          N: ["-E3_0", "-E3_1", "-E3_2"]
          S: ["-E2_0", "-E2_1", "-E2_2"]
          E: ["-E0_0", "-E0_1", "-E0_2"]
          W: ["-E1_0", "-E1_1", "-E1_2"]
      J1:
        lanes_ns_ctrl: ["-E6_0", "-E6_1", "-E6_2", "-E12_0", "-E12_1", "-E12_2"]
        lanes_ew_ctrl: ["-E4_0", "-E4_1", "-E4_2", "E0_0", "E0_1", "E0_2"]
        approach_lanes:
          N: ["-E12_0", "-E12_1", "-E12_2"]
          S: ["-E6_0", "-E6_1", "-E6_2"]
          E: ["-E4_0", "-E4_1", "-E4_2"]
          W: ["E0_0", "E0_1", "E0_2"]
      J2:
        lanes_ns_ctrl: ["E1_0", "E1_1", "E1_2", "-E7_0", "-E7_1", "-E7_2"]
        lanes_ew_ctrl: ["-E5_0", "-E5_1", "-E5_2", "E3_0", "E3_1", "E3_2"]
        approach_lanes:
          N: ["E3_0", "E3_1", "E3_2"]
          S: ["-E5_0", "-E5_1", "-E5_2"]
          E: ["E1_0", "E1_1", "E1_2"]
          W: ["-E7_0", "-E7_1", "-E7_2"]
      J3:
        lanes_ns_ctrl: ["E6_0", "E6_1", "E6_2", "-E8_0", "-E8_1", "-E8_2"]
        lanes_ew_ctrl: ["E2_0", "E2_1", "E2_2", "-E9_0", "-E9_1", "-E9_2"]
        approach_lanes:
          N: ["-E8_0", "-E8_1", "-E8_2"]
          S: ["E6_0", "E6_1", "E6_2"]
          E: ["E2_0", "E2_1", "E2_2"]
          W: ["-E9_0", "-E9_1", "-E9_2"]
      J4:
        lanes_ns_ctrl: ["E5_0", "E5_1", "E5_2", "-E10_0", "-E10_1", "-E10_2"]
        lanes_ew_ctrl: ["-E11_0", "-E11_1", "-E11_2", "E4_0", "E4_1", "E4_2"]
        approach_lanes:
          N: ["-E10_0", "-E10_1", "-E10_2"]
          S: ["E5_0", "E5_1", "E5_2"]
          E: ["-E11_0", "-E11_1", "-E11_2"]
          W: ["E4_0", "E4_1", "E4_2"]
      J6:
        lanes_ns_ctrl: ["E8_0", "E8_1", "E8_2", "-E13_0", "-E13_1", "-E13_2"]
        lanes_ew_ctrl: ["E9_0", "E9_1", "E9_2", "-E14_0", "-E14_1", "-E14_2"]
        approach_lanes:
          N: ["-E13_0", "-E13_1", "-E13_2"]
          S: ["E8_0", "E8_1", "E8_2"]
          E: ["E9_0", "E9_1", "E9_2"]
          W: ["-E14_0", "-E14_1", "-E14_2"]
      J7:
        lanes_ns_ctrl: ["E10_0", "E10_1", "E10_2", "-E15_0", "-E15_1", "-E15_2"]
        lanes_ew_ctrl: ["E11_0", "E11_1", "E11_2", "E14_0", "E14_1", "E14_2"]
        approach_lanes:
          N: ["-E15_0", "-E15_1", "-E15_2"]
          S: ["E10_0", "E10_1", "E10_2"]
          E: ["E11_0", "E11_1", "E11_2"]
          W: ["E14_0", "E14_1", "E14_2"]
      J14:
        lanes_ns_ctrl: ["E7_0", "E7_1", "E7_2", "-E16_0", "-E16_1", "-E16_2"]
        lanes_ew_ctrl: ["-E17_0", "-E17_1", "-E17_2", "E12_0", "E12_1", "E12_2"]
        approach_lanes:
          N: ["-E16_0", "-E16_1", "-E16_2"]
          S: ["E7_0", "E7_1", "E7_2"]
          E: ["-E17_0", "-E17_1", "-E17_2"]
          W: ["E12_0", "E12_1", "E12_2"]
      J17:
        lanes_ns_ctrl: ["E13_0", "E13_1", "E13_2", "E16_0", "E16_1", "E16_2"]
        lanes_ew_ctrl: ["E17_0", "E17_1", "E17_2", "E15_0", "E15_1", "E15_2"]
        approach_lanes:
          N: ["E16_0", "E16_1", "E16_2"]
          S: ["E13_0", "E13_1", "E13_2"]
          E: ["E17_0", "E17_1", "E17_2"]
          W: ["E15_0", "E15_1", "E15_2"]
    phase_program:
      ns_green: 0
      ew_green: 3
      ns_yellow: 1
      ew_yellow: 4
      all_red: 5
    tls_phase_overrides:
      J2:
        ns_green: 0
        ew_green: 3
      J14:
        ns_green: 0
        ew_green: 3

normalization:
  file: configs/norm_curriculum_v3.json

agent:
  hidden_dims: [192, 192]
  gamma: 0.99
  learning_rate: 0.0003
  batch_size: 256
  replay_buffer_size: 200000
  target_update_freq: 3000
  clip_grad_norm: 10.0

exploration:
  eps_start: 1.0
  eps_end: 0.05
  eps_decay_steps: 50000

train:
  episodes: 100
  save_every_episodes: 50
  model_dir: models/parallel_smoke

parallel:
  enabled: true
  num_actors: 2
  base_port: 8813
  base_seed: 42
  chunk_size: 32
  queue_max_chunks: 10
  sync_every_updates: 50
  epsilon_base: 0.2
  epsilon_worker_delta: 0.02
