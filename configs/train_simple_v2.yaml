normalization:
  file: configs/norm_turn801010.json

agent:
  # === SIMPLIFIED NETWORK: Smaller hidden layers ===
  hidden_dims: [128, 128]
  
  # === SIMPLIFIED GAMMA: No time-aware discount ===
  gamma: 0.99
  use_time_aware_gamma: false
  t_ref: 60.0
  
  learning_rate: 0.0001
  batch_size: 256
  replay_buffer_size: 200000
  target_update_freq: 2000      # 6000 steps total → ~3 target syncs for faster convergence
  clip_grad_norm: 10.0
  learning_starts: 1200         # Align with warmup so training kicks in as decay begins
  train_freq: 4            
  use_huber_loss: true       

exploration:
  # 3 workers × 450 eps × ~20 steps/ep ≈ 9000 env steps
  #   Warmup: 1800 steps ≈ 90 eps (20%) at ε_start
  #   Decay:  3600 steps ≈ 180 eps (next 40%) down to ε_end
  #   Exploit: ~180 eps (40%) at ε_end
  eps_start: 0.80
  eps_end: 0.05
  warmup_global_steps: 1800
  eps_decay_steps: 3600

train:
  episodes: 450
  save_every_episodes: 50
  print_every_episodes: 10

baseline:
  fixed_action_id: 2  # Middle split (0.50, 0.50) at 90s cycle

curriculum:
  enabled: true
  phases:
  # Phase 1: Mixed easy (135 episodes, /3) ~70% d400, 20% d650, 10% d850
  - name: "phase1_easy_mix"
    episodes: 135
    max_sim_seconds: 1800
    route_pool_manifest: networks/variants/train_turn801010/manifest_mix_400650850_phase1.txt
    description: "Easy: ~70% d400, 20% d650, 10% d850"

  # Phase 2: Mixed moderate (180 episodes, /3) ~20% d400, 40% d650, 40% d850
  - name: "phase2_moderate_mix"
    episodes: 180
    max_sim_seconds: 1800
    route_pool_manifest: networks/variants/train_turn801010/manifest_mix_400650850_phase2.txt
    description: "Moderate: ~20% d400, 40% d650, 40% d850"

  # Phase 3: Mixed hard (135 episodes, /3) ~10% d400, 25% d650, 65% d850
  - name: "phase3_hard_mix"
    episodes: 135
    max_sim_seconds: 1800
    route_pool_manifest: networks/variants/train_turn801010/manifest_mix_400650850_phase3.txt
    description: "Hard: ~10% d400, 25% d650, 65% d850"

logging:
  log_dir: logs/simple_v2
  model_dir: models/simple_v2
  results_dir: results/simple_v2

parallel:
  enabled: true  
  num_actors: 3  
  base_port: 9500
  base_seed: 42
  chunk_size: 256
  queue_max_chunks: 200
  sync_every_updates: 100
  epsilon_worker_multipliers: [0.90, 1.00, 1.10]
  reset_max_retries: 3
  reset_backoff_base_sec: 1.0
  reset_backoff_cap_sec: 8.0
  max_update_time_ms: 50.0
