      - networks/variants/train_turn801010/400/bignet_turn801010_seed00050_d400.rou.xml
      - networks/variants/train_turn801010/400/bignet_turn801010_seed00051_d400.rou.xml 
    additional_files: []
    tls_ids: ["J0", "J1", "J2", "J3", "J4", "J6", "J7", "J14", "J17"]
    center_tls_id: "J0"
    downstream_links:
      N: "E3"
      E: "E0"
      S: "E2"
      W: "E1"
    vehicle_weights:
      motorcycle: 0.25
      passenger: 1.0
      bus: 3.0
    step_length_sec: 1.0
    green_cycle_sec: 90
    yellow_sec: 3
    all_red_sec: 2
    max_cycles: 60
    max_sim_seconds: 1800
    terminate_on_empty: false
    rho_min: 0.1
    g_min_sec: 10
    
    # === SIMPLIFIED ACTION SPACE: 1 cycle × 5 splits = 5 actions ===
    cycle_options_sec: [90]  # Fixed cycle at 90s
    action_splits:
      - [0.30, 0.70]
      - [0.40, 0.60]
      - [0.50, 0.50]
      - [0.60, 0.40]
      - [0.70, 0.30]
    action_table: []
    
    include_transition_in_waiting: false
    
    # === STABILIZED REWARD: SMDP scale, no PCU weights, linear wait ===
    reward_mode: smdp         # Normalize by t_ref (O(1) scale)
    reward_scope: local       # Local reward per TLS
    reward_time_normalize: false
    use_enhanced_reward: false
    reward_exponent: 1.0      # Linear wait (no square)
    enable_spillback_penalty: false
    alpha_spillback: 0.0
    use_pcu_weighted_wait: false

    sumo_extra_args:
      - "--ignore-junction-blocker"
      - "1"
      - "--time-to-teleport"
      - "300"
      - "--no-warnings"
      - "true"

    enable_kpi_tracker: true
    normalize_state: true
    return_raw_state: false
    
    # === SIMPLIFIED STATE: 10D (8 local + 2 global broadcast) ===
    # NOTE: Requires code modification - see implementation_plan.md
    # For now, use state_dim: 14 with downstream disabled
    state_dim: 14
    enable_downstream_occupancy: false

    deadlock_early_no_arrival_sec: 0
    deadlock_no_arrival_sec: 0
    deadlock_queue_threshold: 0
    deadlock_downstream_occ_threshold: 0
    deadlock_active_min: 0
    deadlock_early_penalty_max: 0
    deadlock_penalty: 0
    terminate_on_deadlock: false
    teleport_failure_when_congested: false

    lane_groups_by_tls:
