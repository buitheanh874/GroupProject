scenario:
  net_file: "networks/hanoi/hanoi.net.xml"
  map_prefix: "hanoi_mdpspec"

  entry_edges:
    - "E1_IN"
    - "W1_IN"
    - "N1_IN"
    - "S1_IN"

  exit_edges:
    - "E1_OUT"
    - "W1_OUT"
    - "N1_OUT"
    - "S1_OUT"

  approach_order: ["N", "E", "S", "W"]
  entry_by_dir:
    N: "N1_IN"
    E: "E1_IN"
    S: "S1_IN"
    W: "W1_IN"
  exit_by_dir:
    N: "N1_OUT"
    E: "E1_OUT"
    S: "S1_OUT"
    W: "W1_OUT"

  target_junctions:
    - "CENTER"

  pcu_weights:
    motorcycle: 0.25
    passenger: 1.0
    bus: 3.0
    other: 1.0

  demand:
    total_pcu_per_hour:
      low: 3000
      med: 5000
      high: 7000
    entry_dirichlet_alpha: 2.0

  vehicle_mix_mean:
    motorcycle: 0.84
    passenger: 0.12
    bus: 0.03
    other: 0.01
  vehicle_mix_kappa: 50

  turning:
    mean_LSR: [0.15, 0.70, 0.15]
    kappa: 30

  turning_overrides: {}

  stages:
    enabled: false
    intervals: []

  min_total_vehicles: 500
  horizon_sec: 3600
