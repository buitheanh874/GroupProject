scenario_calibration: configs/hanoi_calibration.yaml
force_calibration_overrides: false

run:
  seed: 42

logging:
  results_dir: results

eval:
  route_pool_manifest: eval/manifest.txt
  model_path: models/hanoi_latest.pt

env:
  sumo:
    net_file: networks/hanoi/net.xml
    use_pcu_weighted_wait: true
    use_enhanced_reward: false
    reward_exponent: 1.0

action_table:
  - rho_ns: 0.5
    g_min_sec: 10
    cycle_sec: 60
  - rho_ns: 0.6
    g_min_sec: 12
    cycle_sec: 90
