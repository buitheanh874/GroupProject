# Evaluation Configuration for Max Pressure with RAW State
# =========================================================
# Usage: python scripts/eval.py --config configs/eval_mp_raw.yaml
#
# This config evaluates the FlexibleMaxPressureController with raw (not normalized) state
# to properly test the true Max Pressure algorithm.

run:
  run_name: eval_mp_raw
  seed: 42
  device: cpu

env:
  type: sumo
  sumo:
    teleport_penalty_lambda: 0.0
    teleport_time_cap_sec: null
    sumo_binary: sumo
    net_file: networks/BIGNET.net.xml
    route_file: networks/variants/train_turn801010/500/manifest.txt  # Will be overridden per demand
    additional_files: []
    tls_ids: ["J0", "J1", "J2", "J3", "J4", "J6", "J7", "J14", "J17"]
    center_tls_id: "J0"
    downstream_links:
      N: "E3"
      E: "E0"
      S: "E2"
      W: "E1"
    vehicle_weights:
      motorcycle: 0.25
      passenger: 1.0
      bus: 3.0
    step_length_sec: 1.0
    green_cycle_sec: 60
    yellow_sec: 3
    all_red_sec: 2
    max_cycles: 60
    max_sim_seconds: 1500
    terminate_on_empty: false
    rho_min: 0.1
    g_min_sec: 10
    cycle_options_sec: [60, 90, 120]
    action_splits:
      - [0.30, 0.70]
      - [0.40, 0.60]
      - [0.50, 0.50]
      - [0.60, 0.40]
      - [0.70, 0.30]
    action_table: []
    include_transition_in_waiting: false
    reward_time_normalize: true
    sumo_extra_args:
      - "--ignore-junction-blocker"
      - "1"
      - "--time-to-teleport"
      - "300"
    enable_kpi_tracker: true
    
    # CRITICAL: Use raw state for Max Pressure (not normalized)
    normalize_state: false
    return_raw_state: true
    
    state_dim: 14
    enable_downstream_occupancy: true
    enable_spillback_penalty: true
    alpha_spillback: 1.0

    deadlock_early_no_arrival_sec: 0.0
    deadlock_no_arrival_sec: 0.0
    deadlock_queue_threshold: 0.0
    deadlock_downstream_occ_threshold: 0.0
    deadlock_active_min: 0
    deadlock_early_penalty_max: 0.0
    deadlock_penalty: 0.0
    terminate_on_deadlock: false
    teleport_failure_when_congested: false

    lane_groups_by_tls:
      J0:
        lanes_ns_ctrl:
          - "-E3_0"
          - "-E3_1"
          - "-E2_0"
          - "-E2_1"
        lanes_ew_ctrl:
          - "-E1_0"
          - "-E1_1"
          - "-E1_2"
          - "-E0_0"
          - "-E0_1"
          - "-E0_2"
        lanes_right_turn_slip_ns: []
        lanes_right_turn_slip_ew: []
      J3:
        lanes_ns_ctrl:
          - "-E25_0"
          - "-E25_1"
          - "E2_0"
          - "E2_1"
        lanes_ew_ctrl:
          - "-E26_0"
          - "E24_0"
        lanes_right_turn_slip_ns: []
        lanes_right_turn_slip_ew: []
      J1:
        lanes_ns_ctrl:
          - "-E6_0"
          - "-E6_1"
          - "-E5_0"
          - "-E5_1"
        lanes_ew_ctrl:
          - "E0_0"
          - "E0_1"
          - "E0_2"
          - "-E4_0"
          - "-E4_1"
          - "-E4_2"
        lanes_right_turn_slip_ns: []
        lanes_right_turn_slip_ew: []
      J4:
        lanes_ns_ctrl:
          - "E3_0"
          - "E3_1"
          - "-E16_0"
          - "-E16_1"
        lanes_ew_ctrl:
          - "E14_0"
          - "-E15_0"
        lanes_right_turn_slip_ns: []
        lanes_right_turn_slip_ew: []
      J2:
        lanes_ns_ctrl:
          - "-E19_0"
          - "-E19_1"
          - "-E18_0"
          - "-E18_1"
        lanes_ew_ctrl:
          - "E1_0"
          - "E1_1"
          - "E1_2"
          - "-E17_0"
          - "-E17_1"
          - "-E17_2"
        lanes_right_turn_slip_ns: []
        lanes_right_turn_slip_ew: []
      J7:
        lanes_ns_ctrl:
          - "-E27_0"
          - "-E27_1"
          - "E6_0"
          - "E6_1"
        lanes_ew_ctrl:
          - "-E28_0"
          - "E26_0"
        lanes_right_turn_slip_ns: []
        lanes_right_turn_slip_ew: []
      J6:
        lanes_ns_ctrl:
          - "E5_0"
          - "E5_1"
          - "-E13_0"
          - "-E13_1"
        lanes_ew_ctrl:
          - "-E12_0"
          - "-E14_0"
        lanes_right_turn_slip_ns: []
        lanes_right_turn_slip_ew: []
      J14:
        lanes_ns_ctrl:
          - "E18_0"
          - "E18_1"
          - "-E21_0"
          - "-E21_1"
        lanes_ew_ctrl:
          - "E15_0"
          - "-E20_0"
        lanes_right_turn_slip_ns: []
        lanes_right_turn_slip_ew: []
      J17:
        lanes_ns_ctrl:
          - "-E22_0"
          - "-E22_1"
          - "E19_0"
          - "E19_1"
        lanes_ew_ctrl:
          - "-E24_0"
          - "-E23_0"
        lanes_right_turn_slip_ns: []
        lanes_right_turn_slip_ew: []
    phase_program:
      ew_green: 0
      ew_yellow: 1
      all_red: 2
      ns_green: 3
      ns_yellow: 4

# Normalization is DISABLED for raw MP testing
normalization:
  file: null  # No normalization

# Evaluation parameters for MP testing
eval_matrix:
  policies:
    - max_pressure
  
  demands:
    - 500
    - 750
    - 1000
  
  seeds: 3
  horizon: 1500
  warmup: 300
  unseen: false
  output: results/eval_mp_raw.csv

# Model paths (not used for MP)
models:
  rl_full: models/1/best_model.pt
  rl_plain: models/1_plain/best_model.pt

# Agent architecture (not used for MP)
agent:
  hidden_dims: [192, 192]
  gamma: 0.99

baseline:
  fixed_action_id: 2

logging:
  results_dir: results/eval_mp_raw
