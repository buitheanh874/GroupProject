run:
  run_name: eval_1
  seed: 42
  device: cpu

env:
  type: sumo
  sumo:
    teleport_penalty_lambda: 0.0
    teleport_time_cap_sec: null
    sumo_binary: sumo
    net_file: networks/BIGNET.net.xml
    route_file: networks/variants/eval/bignet_low_eval_seed100042.rou.xml
    additional_files: []
    tls_ids: ["J0", "J1", "J2", "J3", "J4", "J6", "J7", "J14", "J17"]
    center_tls_id: "J0"
    downstream_links:
      N: "E3"
      E: "E0"
      S: "E2"
      W: "E1"
    vehicle_weights:
      motorcycle: 0.25
      passenger: 1.0
      bus: 3.0
    step_length_sec: 1.0
    green_cycle_sec: 60
    yellow_sec: 3
    all_red_sec: 2
    max_cycles: 60
    max_sim_seconds: 1800
    terminate_on_empty: false
    rho_min: 0.1
    g_min_sec: 10
    cycle_options_sec: [60, 90, 120]
    action_splits:
      - [0.30, 0.70]
      - [0.40, 0.60]
      - [0.50, 0.50]
      - [0.60, 0.40]
      - [0.70, 0.30]
    action_table: []
    include_transition_in_waiting: false
    reward_time_normalize: true
    sumo_extra_args:
      - "--ignore-junction-blocker"
      - "1"
      - "--time-to-teleport"
      - "300"
    enable_kpi_tracker: true
    normalize_state: true
    return_raw_state: false
    state_dim: 14  # SMDP v5: 12 local + 2 global broadcast
    enable_downstream_occupancy: true
    enable_spillback_penalty: true
    alpha_spillback: 1.0

    deadlock_early_no_arrival_sec: 0.0
    deadlock_no_arrival_sec: 0.0
    deadlock_queue_threshold: 0.0
    deadlock_downstream_occ_threshold: 0.0
    deadlock_active_min: 0
    deadlock_early_penalty_max: 0.0
    deadlock_penalty: 0.0
    terminate_on_deadlock: false
    teleport_failure_when_congested: false

    lane_groups_by_tls:
      J0:
        lanes_ns_ctrl:
          - "-E3_0"
          - "-E3_1"
          - "-E2_0"
          - "-E2_1"
        lanes_ew_ctrl:
          - "-E1_0"
          - "-E1_1"
          - "-E1_2"
          - "-E0_0"
          - "-E0_1"
          - "-E0_2"
        lanes_right_turn_slip_ns: []
        lanes_right_turn_slip_ew: []
      J3:
        lanes_ns_ctrl:
          - "-E25_0"
          - "-E25_1"
          - "E2_0"
          - "E2_1"
        lanes_ew_ctrl:
          - "-E26_0"
          - "E24_0"
        lanes_right_turn_slip_ns: []
        lanes_right_turn_slip_ew: []
      J1:
