# FINAL DESIGN: Simplified Traffic Signal Control
# - Fixed cycle: 60s
# - 3 discrete actions (30:70, 50:50, 70:30)
# - Global reward: simple_clipped (clipped to [-1, 0] for training stability)
# - 12 workers, 250 episodes each = 3000 total
# - Episode: 1800s, 30 steps

run:
  run_name: train_final_design
  seed: 42
  device: cpu

env:
  type: sumo
  sumo:
    teleport_penalty_lambda: 5.0
    teleport_time_cap_sec: null
    sumo_binary: sumo
    net_file: networks/BIGNET.net.xml
    route_file: networks/variants/train_final/easy/bignet_d350_ns_heavy_seed00001.rou.xml  # placeholder
    additional_files: []
    tls_ids: ["J0", "J1", "J2", "J3", "J4", "J6", "J7", "J14", "J17"]
    center_tls_id: "J0"
    downstream_links:
      N: "E3"
      E: "E0"
      S: "E2"
      W: "E1"
    vehicle_weights:
      motorcycle: 0.25
      passenger: 1.0
      bus: 3.0
    step_length_sec: 1.0
    green_cycle_sec: 60
    yellow_sec: 3
    all_red_sec: 2
    max_cycles: 60
    max_sim_seconds: 1800  # 30 min episode -> 30 steps
    terminate_on_empty: false
    rho_min: 0.1
    g_min_sec: 10
    
    # FIXED CYCLE: 60s only
    cycle_options_sec: [60]
    
    # 3 DISCRETE ACTIONS
    action_splits:
      - [0.30, 0.70]  # favor EW
      - [0.50, 0.50]  # balanced
      - [0.70, 0.30]  # favor NS
    action_table: []
    include_transition_in_waiting: false
    
    # SIMPLE CLIPPED REWARD
    reward_mode: simple_clipped
    reward_time_normalize: false
    
    # GLOBAL REWARD SCOPE
    reward_scope: global

    sumo_extra_args:
      - "--ignore-junction-blocker"
      - "1"
      - "--time-to-teleport"
      - "300"
      - "--no-warnings"
      - "true"

    enable_kpi_tracker: true
    normalize_state: true
    return_raw_state: false
    state_dim: 14
    enable_downstream_occupancy: false  # Disabled for fairness
    enable_spillback_penalty: false
    alpha_spillback: 0.0

    deadlock_early_no_arrival_sec: 0
    deadlock_no_arrival_sec: 0
    deadlock_queue_threshold: 0
    deadlock_downstream_occ_threshold: 0
    deadlock_active_min: 0
    deadlock_early_penalty_max: 0
    deadlock_penalty: 0
    terminate_on_deadlock: false
    teleport_failure_when_congested: false

    lane_groups_by_tls:
      J0:
        lanes_ns_ctrl:
          - "-E2_0"
          - "-E2_1"
          - "-E2_2"
          - "-E3_0"
          - "-E3_1"
          - "-E3_2"
        lanes_ew_ctrl:
          - "-E0_0"
          - "-E0_1"
          - "-E0_2"
          - "-E1_0"
          - "-E1_1"
          - "-E1_2"
        lanes_right_turn_slip_ns: []
        lanes_right_turn_slip_ew: []
        approach_lanes:
          N: ["-E2_0", "-E2_1", "-E2_2"]
          E: ["-E0_0", "-E0_1", "-E0_2"]
          S: ["-E3_0", "-E3_1", "-E3_2"]
          W: ["-E1_0", "-E1_1", "-E1_2"]
      J3:
        lanes_ns_ctrl:
          - "-E25_0"
          - "-E25_1"
          - "-E25_2"
          - "E2_0"
          - "E2_1"
          - "E2_2"
        lanes_ew_ctrl:
          - "-E26_0"
          - "-E26_1"
          - "-E26_2"
          - "E24_0"
          - "E24_1"
          - "E24_2"
        lanes_right_turn_slip_ns: []
        lanes_right_turn_slip_ew: []
        approach_lanes:
          N: ["-E25_0", "-E25_1", "-E25_2"]
          E: ["-E26_0", "-E26_1", "-E26_2"]
          S: ["E2_0", "E2_1", "E2_2"]
          W: ["E24_0", "E24_1", "E24_2"]
