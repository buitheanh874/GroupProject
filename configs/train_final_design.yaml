        ns_green: 0
        ew_green: 3
      J2:
        ns_green: 0
        ew_green: 3
      J3:
        ns_green: 0
        ew_green: 3
      J14:
        ns_green: 0
        ew_green: 3
      J7:
        ns_green: 0
        ew_green: 3

normalization:
  file: configs/norm_final_design.json

agent:
  hidden_dims: [128, 128]
  gamma: 0.99
  use_time_aware_gamma: false  
  t_ref: 60.0                   
  learning_rate: 0.0001
  batch_size: 256
  replay_buffer_size: 200000
  target_update_freq: 5000
  clip_grad_norm: 10.0
  learning_starts: 2000     
  train_freq: 4            
  use_huber_loss: true       

exploration:
  eps_start: 0.60 
  eps_end: 0.05
  warmup_global_steps: 5000
  eps_decay_steps: 40000  # Reaches eps_end at ~55% training (45k/81k steps) - SAFE for convergence      

train:
  episodes: 250  # per worker, total 3000 with 12 workers

baseline:
  fixed_action_id: 1  # balanced action (50:50)

curriculum:
  enabled: true
  phases:
    # 200 episodes curriculum phase (per worker)
    - name: "easy"
      episodes: 120  # 60% of 200
      max_sim_seconds: 1800
      route_pool_manifest: networks/variants/train_final/manifest_easy.txt
      description: "Easy: 350 veh/hr/lane, 3 imbalance types"
    
    - name: "medium"
      episodes: 60   # 30% of 200
      max_sim_seconds: 1800
      route_pool_manifest: networks/variants/train_final/manifest_medium.txt
      description: "Medium: 500 veh/hr/lane, 3 imbalance types"
    
    - name: "hard"
      episodes: 20   # 10% of 200
      max_sim_seconds: 1800
      route_pool_manifest: networks/variants/train_final/manifest_hard.txt
      description: "Hard: 650 veh/hr/lane, 3 imbalance types"
    
    # 50 episodes mix phase (per worker) - random from all levels
    - name: "mix"
      episodes: 50   # 20% - Final mix phase for generalization
      max_sim_seconds: 1800
      route_pool_manifest: networks/variants/train_final/manifest_mix.txt
      description: "Mix: Random from all demand levels (60% easy, 30% medium, 10% hard)"

logging:
  log_dir: logs/final_design
  model_dir: models/final_design
  results_dir: results/final_design

parallel:
  enabled: true  
  num_actors: 12
  base_port: 9500
  base_seed: 42
  chunk_size: 256
  queue_max_chunks: 200
  sync_every_updates: 100
  epsilon_worker_multipliers: [0.92, 0.94, 0.96, 0.98, 0.99, 1.00, 1.01, 1.02, 1.04, 1.06, 1.08, 1.10]  # Tighter range for consistent convergence
  reset_max_retries: 3
  reset_backoff_base_sec: 1.0
  reset_backoff_cap_sec: 8.0
  max_update_time_ms: 50.0

# Performance optimizations (all SAFE - do not change MDP/algorithm)
performance:
  enable_all_optimizations: true  # Master switch (set true to enable all)
  
  # Individual toggles (only apply if enable_all is true)
  disable_sumo_logs: true           # Suppress SUMO file outputs in TRAIN mode
  use_traci_subscriptions: false    # TraCI batch subscriptions (OFF by default)
  subscribe_scalar_only: true       # Only scalar vars (safer than ID lists)
  subscribe_with_id_list: false     # ID list (only if distinct_cycle needs it)
  use_packed_transitions: true      # Numpy array serialization
  use_batch_replay_push: true       # Replay buffer push_batch
  interval_logging_sec: 2.0         # Log every N seconds (0 = per-step)
  worker0_verbose_only: true        # Only worker rank=0 logs verbose
  queue_maxsize: 1000               # Queue backpressure (0 = unbounded)
