run:
  run_name: train_1
  seed: 42
  device: cpu

env:
  type: sumo
  sumo:
    teleport_penalty_lambda: 0.0
    teleport_time_cap_sec: null
    sumo_binary: sumo
    net_file: networks/BIGNET.net.xml
    route_file: networks/variants/train/bignet_train_seed00042.rou.xml
    additional_files: []
    tls_ids: ["J0", "J1", "J2", "J3", "J4", "J6", "J7", "J14", "J17"]
    center_tls_id: "J0"
    downstream_links:
      N: "E3"
      E: "E0"
      S: "E2"
      W: "E1"
    vehicle_weights:
      motorcycle: 0.25
      passenger: 1.0
      bus: 3.0
    step_length_sec: 1.0
    green_cycle_sec: 60
    yellow_sec: 3
    all_red_sec: 2
    max_cycles: 60
    max_sim_seconds: 1800
    terminate_on_empty: false
    rho_min: 0.1
    g_min_sec: 10
    lambda_fairness: 0.0
    allowed_cycles_sec: [60, 90, 120]
    cycle_options_sec: [60, 90, 120]
    action_splits:
      - [0.30, 0.70]
      - [0.40, 0.60]
      - [0.50, 0.50]
      - [0.60, 0.40]
      - [0.70, 0.30]
    action_table: []
    include_transition_in_waiting: false
    reward_time_normalize: true

    sumo_extra_args:
      - "--ignore-junction-blocker"
      - "1"
      - "--time-to-teleport"
      - "300"

    enable_kpi_tracker: true
    normalize_state: true
    return_raw_state: false
    state_dim: 12
    enable_downstream_occupancy: true
    enable_spillback_penalty: true
    occ_threshold: 0.65
    beta: 1.0

    deadlock_early_no_arrival_sec: 30.0
    deadlock_no_arrival_sec: 150.0
    deadlock_queue_threshold: 20.0
    deadlock_downstream_occ_threshold: 0.85
    deadlock_active_min: 30
    deadlock_early_penalty_max: 5.0
    deadlock_penalty: 100.0
    terminate_on_deadlock: true
    teleport_failure_when_congested: true

    lane_groups_by_tls:
      J0:
        lanes_ns_ctrl:
          - "-E3_0"
          - "-E3_1"
          - "-E2_0"
          - "-E2_1"
        lanes_ew_ctrl:
          - "-E1_0"
          - "-E1_1"
          - "-E1_2"
          - "-E0_0"
          - "-E0_1"
          - "-E0_2"
        lanes_right_turn_slip_ns: []
        lanes_right_turn_slip_ew: []
      J3:
        lanes_ns_ctrl:
          - "-E25_0"
          - "-E25_1"
          - "E2_0"
          - "E2_1"
        lanes_ew_ctrl:
          - "-E26_0"
          - "E24_0"
        lanes_right_turn_slip_ns: []
        lanes_right_turn_slip_ew: []
      J1:
        lanes_ns_ctrl:
          - "-E6_0"
          - "-E6_1"
          - "-E5_0"
          - "-E5_1"
        lanes_ew_ctrl:
          - "E0_0"
          - "E0_1"
          - "E0_2"
          - "-E4_0"
          - "-E4_1"
          - "-E4_2"
        lanes_right_turn_slip_ns: []
        lanes_right_turn_slip_ew: []
      J4:
        lanes_ns_ctrl:
          - "E3_0"
          - "E3_1"
          - "-E16_0"
          - "-E16_1"
        lanes_ew_ctrl:
          - "E14_0"
          - "-E15_0"
        lanes_right_turn_slip_ns: []
        lanes_right_turn_slip_ew: []
      J2:
        lanes_ns_ctrl:
          - "-E19_0"
          - "-E19_1"
          - "-E18_0"
          - "-E18_1"
        lanes_ew_ctrl:
          - "E1_0"
          - "E1_1"
          - "E1_2"
          - "-E17_0"
          - "-E17_1"
          - "-E17_2"
        lanes_right_turn_slip_ns: []
        lanes_right_turn_slip_ew: []
      J7:
        lanes_ns_ctrl:
          - "-E27_0"
          - "-E27_1"
          - "E6_0"
          - "E6_1"
        lanes_ew_ctrl:
          - "-E28_0"
          - "E26_0"
        lanes_right_turn_slip_ns: []
        lanes_right_turn_slip_ew: []
      J6:
        lanes_ns_ctrl:
          - "E5_0"
          - "E5_1"
          - "-E13_0"
          - "-E13_1"
        lanes_ew_ctrl:
          - "-E12_0"
          - "-E14_0"
        lanes_right_turn_slip_ns: []
        lanes_right_turn_slip_ew: []
      J14:
        lanes_ns_ctrl:
          - "E18_0"
          - "E18_1"
          - "-E21_0"
          - "-E21_1"
        lanes_ew_ctrl:
          - "E15_0"
          - "-E20_0"
        lanes_right_turn_slip_ns: []
        lanes_right_turn_slip_ew: []
      J17:
        lanes_ns_ctrl:
          - "-E22_0"
          - "-E22_1"
          - "E19_0"
          - "E19_1"
        lanes_ew_ctrl:
          - "-E24_0"
          - "-E23_0"
        lanes_right_turn_slip_ns: []
        lanes_right_turn_slip_ew: []
    phase_program:
      ew_green: 0
      ew_yellow: 1
      all_red: 2
      ns_green: 3
      ns_yellow: 4

normalization:
  file: configs/norm_1.json

agent:
  hidden_dims: [256, 256]
  gamma: 0.99
  learning_rate: 0.0003
  batch_size: 256
  replay_buffer_size: 200000
  target_update_freq: 2000

exploration:
  eps_start: 1.0
  eps_end: 0.02
  eps_decay_steps: 150000

train:
  episodes: 500
  save_every_episodes: 50
  print_every_episodes: 5
  route_pool_manifest: networks/variants/train/manifest.txt

baseline:
  fixed_action_id: 2

logging:
  log_dir: logs/1
  model_dir: models/1
  results_dir: results/1
